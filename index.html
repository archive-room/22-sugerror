
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SUGERROR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Jost:wght@300;400;500;600;700;800&display=swap');

:root {
  --ink: #29262d;
  --pink: #df9bbf;
  --blue: #a6d7e3;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  font-family: 'Jost', sans-serif;
  background: #f5f4f2;
  color: var(--ink);
}
button { font: inherit; }
.screen {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ERROR SCREEN */
#error {
  display: flex;
  flex-direction: column;
  padding: 28px;
  background: #f5f4f2;
  z-index: 2;
  cursor: pointer;
}
.topline, .bottomline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 10px 'DM Mono', monospace;
  letter-spacing: 1px;
}
.topline {
  padding-bottom: 14px;
  border-bottom: 1px solid #bebbc0;
}
.bottomline {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid #bebbc0;
}
.error-center {
  margin: auto 0;
  position: relative;
}
.micro {
  font: 10px 'DM Mono', monospace;
  letter-spacing: 2px;
  color: #87818a;
}
.error-title {
  margin: 18px 0;
  font-size: clamp(65px, 18vw, 180px);
  font-weight: 800;
  letter-spacing: -.085em;
  line-height: .88;
  position: relative;
}
.error-title span {
  display: block;
}
.error-description {
  margin-top: 28px;
  font: 11px/2 'DM Mono', monospace;
  color: #77717b;
}
.enter {
  margin-top: 36px;
  display: inline-flex;
  align-items: center;
  gap: 18px;
  background: transparent;
  border: 1px solid #b6b1b9;
  padding: 14px 18px;
  color: var(--ink);
  font: 11px 'DM Mono', monospace;
  letter-spacing: 2px;
  cursor: pointer;
}
.enter i {
  font-style: normal;
  font-size: 18px;
}

/* GLITCH */
#error.corrupt {
  background: #141219;
  color: white;
  animation: shake .07s steps(2) infinite;
}
.corrupt .error-title {
  animation: jitter .1s steps(2) infinite;
}
.corrupt .error-title::before,
.corrupt .error-title::after {
  content: "ERROR\A 404";
  white-space: pre;
  position: absolute;
  inset: 0;
  line-height: .88;
  pointer-events: none;
}
.corrupt .error-title::before {
  color: #ff78ae;
  animation: splitA .13s steps(2) infinite;
  clip-path: inset(12% 0 53% 0);
}
.corrupt .error-title::after {
  color: #6bd8e8;
  animation: splitB .09s steps(2) infinite;
  clip-path: inset(57% 0 13% 0);
}
@keyframes shake {
  0% { transform: translate(0,0); }
  50% { transform: translate(-3px,2px); }
  100% { transform: translate(4px,-1px); }
}
@keyframes jitter {
  0% { transform: translateX(-5px); }
  50% { transform: translateX(7px) skewX(3deg); }
  100% { transform: translateX(-2px); }
}
@keyframes splitA {
  0% { transform: translate(-12px,1px); }
  50% { transform: translate(9px,-3px); }
  100% { transform: translate(-4px,2px); }
}
@keyframes splitB {
  0% { transform: translate(10px,-2px); }
  50% { transform: translate(-8px,3px); }
  100% { transform: translate(5px,0); }
}
#noise {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0;
  z-index: 5;
  mix-blend-mode: screen;
}
#noise.active { opacity: .75; }

/* MAIN WORLD */
#world {
  z-index: 1;
  background:
    radial-gradient(ellipse at 72% 25%, #e8d8ee 0%, transparent 52%),
    radial-gradient(ellipse at 12% 85%, #f3cedf 0%, transparent 48%),
    #fcf9fa;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1s ease;
}
#world.visible { opacity: 1; }
.world-top {
  position: absolute;
  top: 28px;
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  font: 10px 'DM Mono', monospace;
  letter-spacing: 1px;
}
.orbit {
  width: min(80vw, 370px);
  aspect-ratio: 1;
  position: absolute;
  display: grid;
  place-items: center;
}
.orbit svg {
  width: 100%;
  height: 100%;
  animation: rotate 26s linear infinite;
  overflow: visible;
}
@keyframes rotate {
  to { transform: rotate(360deg); }
}
.orbit text {
  fill: #c997b5;
  font: 12px 'DM Mono', monospace;
  letter-spacing: 3px;
}
.orbit::after {
  content: "";
  position: absolute;
  inset: 16%;
  border: 1px solid #dbbdcf;
  border-radius: 50%;
  opacity: .6;
}
.world-title {
  position: relative;
  z-index: 1;
  font-size: clamp(36px, 11vw, 84px);
  font-weight: 700;
  letter-spacing: -.06em;
  color: #74566d;
  text-align: center;
}
.world-sub {
  position: relative;
  z-index: 1;
  margin-top: 14px;
  font: 10px 'DM Mono', monospace;
  letter-spacing: 2px;
  color: #ae89a4;
  text-align: center;
}
.world-bottom {
  position: absolute;
  bottom: 28px;
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 10px 'DM Mono', monospace;
}
#restart {
  padding: 8px;
  border: 0;
  background: transparent;
  color: #8a6c82;
  cursor: pointer;
}
@media (prefers-reduced-motion: reduce) {
  .orbit svg { animation: none; }
  #world { transition: none; }
}
</style>
</head>
<body>

<section id="error" class="screen" aria-label="Opening">
  <div class="topline">
    <span>SYS. / UNKNOWN</span>
    <span>STATUS: FAILED</span>
  </div>
  <div class="error-center">
    <div class="micro">AN UNEXPECTED EXCEPTION</div>
    <h1 class="error-title">
      <span>ERROR</span>
      <span>404</span>
    </h1>
    <div class="error-description">
      THE REQUESTED WORLD COULD NOT BE FOUND.<br>
      PLEASE VERIFY YOUR EXISTENCE.
    </div>
    <button class="enter" id="enter">
      TAP TO CONTINUE <i>↗</i>
    </button>
  </div>
  <div class="bottomline">
    <span>REF: 000-404</span>
    <span>© SUGERROR</span>
  </div>
</section>

<canvas id="noise" aria-hidden="true"></canvas>

<section id="world" class="screen" aria-label="SUGERROR">
  <div class="world-top">
    <span>SUGERROR / HOME</span>
    <span>01 — 00</span>
  </div>
  <div class="orbit">
    <svg viewBox="0 0 300 300">
      <defs>
        <path id="circleText"
          d="M150,150 m-125,0
          a125,125 0 1,1 250,0
          a125,125 0 1,1 -250,0"/>
      </defs>
      <text>
        <textPath href="#circleText">
          WELCOME TO A SWEET LITTLE ERROR ·
          WELCOME TO A SWEET LITTLE ERROR ·
        </textPath>
      </text>
    </svg>
  </div>
  <div class="world-title">SUGERROR</div>
  <div class="world-sub">A SWEET LITTLE MISTAKE.</div>
  <div class="world-bottom">
    <span>WELCOME TO MY WORLD</span>
    <button id="restart">↺ REPLAY</button>
  </div>
</section>

<script>
const error = document.getElementById('error');
const world = document.getElementById('world');
const canvas = document.getElementById('noise');
const ctx = canvas.getContext('2d');
const enter = document.getElementById('enter');
const restart = document.getElementById('restart');

let running = false;
let timer = null;
let frame = null;

function resizeNoise() {
  canvas.width = 240;
  canvas.height = Math.max(
    160,
    Math.round(240 * innerHeight / innerWidth)
  );
}

function drawNoise() {
  if (!running) return;
  const w = canvas.width;
  const h = canvas.height;
  const image = ctx.createImageData(w, h);
  const p = image.data;

  for (let i = 0; i < p.length; i += 4) {
    const value = Math.random() > .52 ? 255 : 0;
    p[i] = value;
    p[i+1] = value;
    p[i+2] = value;
    p[i+3] = Math.random() * 170;
  }
  ctx.putImageData(image, 0, 0);

  for (let n = 0; n < 8; n++) {
    ctx.fillStyle = Math.random() > .5
      ? 'rgba(255,100,170,.6)'
      : 'rgba(100,210,230,.6)';
    ctx.fillRect(
      0,
      Math.random() * h,
      w,
      Math.random() * 5 + 1
    );
  }

  frame = requestAnimationFrame(drawNoise);
}

function stopNoise() {
  running = false;
  cancelAnimationFrame(frame);
  canvas.classList.remove('active');
}

function start() {
  if (running || error.style.display === 'none') return;

  const reduced = matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  enter.disabled = true;

  if (!reduced) {
    running = true;
    error.classList.add('corrupt');
    canvas.classList.add('active');
    resizeNoise();
    drawNoise();
  }

  timer = setTimeout(() => {
    stopNoise();
    error.style.display = 'none';
    world.classList.add('visible');
  }, reduced ? 150 : 1100);
}

function reset() {
  clearTimeout(timer);
  stopNoise();
  world.classList.remove('visible');
  error.classList.remove('corrupt');
  error.style.display = 'flex';
  enter.disabled = false;
}

error.addEventListener('click', start);
enter.addEventListener('click', start);
restart.addEventListener('click', reset);
</script>
</body>
</html>
